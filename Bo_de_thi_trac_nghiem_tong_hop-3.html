body{font-family:Arial,sans-serif;max-width:850px;margin:0 auto;padding:20px;background:#f3f6fa}
.card{background:white;padding:28px;border-radius:16px;box-shadow:0 3px 14px #0002}
h1{font-size:22px;text-align:center} .progress{color:#555;text-align:center;margin-bottom:20px}
.option{display:block;border:1px solid #ddd;padding:15px;margin:10px 0;border-radius:10px;cursor:pointer}
.option:hover{background:#f5f8ff} input{margin-right:12px}
button{padding:12px 22px;border:0;border-radius:8px;background:#1769e0;color:white;font-size:16px;cursor:pointer;margin-top:15px}
button:disabled{background:#aaa} .nav{display:flex;justify-content:space-between;gap:10px}
#result{display:none;text-align:center} .correct{color:#15803d;font-weight:bold} .wrong{color:#dc2626;font-weight:bold}
.bar{height:8px;background:#e5e7eb;border-radius:10px;margin-bottom:20px} .fill{height:100%;background:#1769e0;border-radius:10px;transition:.3s}
.reviewItem{text-align:left;border:1px solid #ddd;border-radius:10px;padding:14px;margin:12px 0}
.reviewItem .qtext{font-weight:bold;margin-bottom:8px}
.reviewItem .opt{padding:4px 0}
.menuItem{display:flex;justify-content:space-between;align-items:center;border:1px solid #ddd;padding:18px;margin:12px 0;border-radius:12px;cursor:pointer;transition:.15s}
.menuItem:hover{background:#f5f8ff;border-color:#1769e0}
.menuItem .mtitle{font-weight:bold;font-size:17px}
.menuItem .mcount{color:#666;font-size:14px;margin-top:4px}
.menuItem .arrow{font-size:22px;color:#1769e0}
.backlink{display:inline-block;margin-bottom:14px;color:#1769e0;cursor:pointer;text-decoration:underline;font-size:14px}

const quizOrder = ["van_hoa", "scada", "ktd_co_ban", "noi_quy"];

let activeKey = null;
let questions = [];
let current = 0;
let answers = [];

function renderMenu(){
  const list = document.getElementById('menuList');
  list.innerHTML = '';
  quizOrder.forEach(key=>{
    const info = quizzes[key];
    const div = document.createElement('div');
    div.className = 'menuItem';
    div.innerHTML = `<div><div class="mtitle">${info.title}</div><div class="mcount">${info.questions.length} câu hỏi</div></div><div class="arrow">→</div>`;
    div.onclick = ()=>startQuiz(key);
    list.appendChild(div);
  });
}

function startQuiz(key){
  activeKey = key;
  questions = quizzes[key].questions;
  current = 0;
  answers = Array(questions.length).fill(null);
  document.getElementById('menu').style.display='none';
  document.getElementById('result').style.display='none';
  document.getElementById('reviewCard').style.display='none';
  document.getElementById('quiz').style.display='block';
  document.getElementById('quizTitle').innerText = quizzes[key].title;
  render();
}

function backToMenu(){
  document.getElementById('quiz').style.display='none';
  document.getElementById('result').style.display='none';
  document.getElementById('reviewCard').style.display='none';
  document.getElementById('menu').style.display='block';
}

function render(){
 const q=questions[current];
 document.getElementById('progress').innerText=`Câu ${current+1} / ${questions.length}`;
 document.getElementById('fill').style.width=((current+1)/questions.length*100)+'%';
 document.getElementById('question').innerText=q.q;
 const box=document.getElementById('options'); box.innerHTML='';
 q.options.forEach(([label,text])=>{
   const div=document.createElement('label'); div.className='option';
   div.innerHTML=`<input type="radio" name="answer" value="${label}" ${answers[current]===label?'checked':''}> <b>${label}.</b> ${text}`;
   div.querySelector('input').onchange=()=>answers[current]=label;
   box.appendChild(div);
 });
 document.getElementById('prev').disabled=current===0;
 document.getElementById('next').innerText=current===questions.length-1?'Nộp bài':'Câu tiếp →';
}
function nextQuestion(){
 if(current<questions.length-1){current++;render();}
 else submitQuiz();
}
function prevQuestion(){if(current>0){current--;render();}}
function submitQuiz(){
 let correct=answers.filter((a,i)=>a===questions[i].correct).length;
 let unanswered=answers.filter(a=>a===null).length;
 document.getElementById('quiz').style.display='none';
 document.getElementById('result').style.display='block';
 document.getElementById('score').innerHTML=`Bạn đúng <span class="correct">${correct}/${questions.length}</span> câu`;
 document.getElementById('detail').innerText=`Điểm: ${(correct/questions.length*10).toFixed(2)}/10. Chưa trả lời: ${unanswered} câu.`;
}
function review(){
 document.getElementById('result').style.display='none';
 document.getElementById('reviewCard').style.display='block';
 const list=document.getElementById('reviewList'); list.innerHTML='';
 questions.forEach((q,i)=>{
   const div=document.createElement('div'); div.className='reviewItem';
   let optsHtml='';
   q.options.forEach(([label,text])=>{
     let cls='opt';
     if(label===q.correct) cls+=' correct';
     else if(label===answers[i] && answers[i]!==q.correct) cls+=' wrong';
     optsHtml+=`<div class="${cls}"><b>${label}.</b> ${text}${label===q.correct?' ✓':''}${label===answers[i] && answers[i]!==q.correct?' ✗ (bạn chọn)':''}</div>`;
   });
   div.innerHTML=`<div class="qtext">Câu ${i+1}. ${q.q}</div>${optsHtml}`;
   list.appendChild(div);
 });
}
function backToResult(){
 document.getElementById('reviewCard').style.display='none';
 document.getElementById('result').style.display='block';
}

renderMenu();
</script>
